name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy --strict)
        run: mypy --strict src

      # Coverage gate on the core layers; thresholds live in pyproject.toml
      # ([tool.coverage.report]) and the Makefile's `test-cov` target.
      - name: Test with coverage gate (domain + application ≥ 90%)
        run: >
          pytest -v
          --cov=src/domain
          --cov=src/application
          --cov-report=term-missing
          --cov-fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f infra/docker/bot.Dockerfile -t umd:ci .
