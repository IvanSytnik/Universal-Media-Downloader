name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The system binary, as in the image: test_media_facts runs ffprobe
      # on a real clip and is skipped without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Same uv as infra/docker/bot.Dockerfile.
      - name: Install uv
        run: pip install uv==0.8.22

      # --locked fails when uv.lock is out of date with pyproject.toml, so
      # this is also the lock check; tests run on the versions the image ships.
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      # tests/ is not type-checked yet (backlog); this file is, because its
      # runner fakes are typed against RunDownloadInProcess to catch
      # signature drift.
      - name: Type check (mypy --strict)
        run: uv run mypy --strict src tests/unit/test_ytdlp_downloader.py

      # Coverage gate on the core layers; thresholds live in pyproject.toml
      # ([tool.coverage.report]) and the Makefile's `test-cov` target.
      # Fails on any skip except the PostgreSQL migration tests, which the
      # `migrations` job runs: a skipped test here is a test nobody runs.
      - name: Test with coverage gate (domain + application ≥ 90%)
        run: |
          set -o pipefail
          uv run pytest -v -rs --cov=src/domain --cov=src/application \
            --cov-report=term-missing --cov-fail-under=90 | tee pytest.out
          # -v also prints "<test> SKIPPED" per test, without the reason; check
          # only the -rs summary lines, which carry it.
          ! grep -E '^SKIPPED \[' pytest.out | grep -v UMD_MIGRATION_TEST_PG

  # Migration test against a real PostgreSQL (CHECK constraints, server
  # defaults and backfills behave differently on SQLite). The test is
  # opt-in via UMD_MIGRATION_TEST_PG and skipped in lint-and-test.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umd
          POSTGRES_PASSWORD: umd
          POSTGRES_DB: umd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UMD_MIGRATION_TEST_PG: 127.0.0.1:5432
      POSTGRES_USER: umd
      POSTGRES_PASSWORD: umd
      BOT_TOKEN: ci-dummy-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same uv as infra/docker/bot.Dockerfile.
      - name: Install uv
        run: pip install uv==0.8.22

      # --locked fails when uv.lock is out of date with pyproject.toml, so
      # this is also the lock check; tests run on the versions the image ships.
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --extra dev

      # Fails on a skip too: a flag-gated test that silently skips here
      # would be a test nobody runs.
      - name: Migration test (upgrade / downgrade on PostgreSQL)
        run: |
          set -o pipefail
          uv run pytest -v -rs tests/integration/test_migration_0005.py tests/integration/test_migration_0006.py | tee pytest.out
          ! grep -q SKIPPED pytest.out

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f infra/docker/bot.Dockerfile -t umd:ci .
