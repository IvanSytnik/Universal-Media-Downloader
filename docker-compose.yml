services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umd}
      POSTGRES_USER: ${POSTGRES_USER:-umd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umd}
    ports:
      # Host port is configurable and defaults to 5433, not 5432, so it
      # does not clash with a locally installed Postgres or another
      # compose project. Change it with HOST_POSTGRES_PORT in .env.
      # Bound to 127.0.0.1: the default credentials must never be
      # reachable from outside the host.
      - "127.0.0.1:${HOST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umd}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Without a restart policy the daemon does not bring this back after a
    # host/daemon restart, while bot/worker (unless-stopped) do — and then
    # crash-loop on DNS lookup of a missing service. depends_on ordering
    # only applies to `docker compose up`, not to daemon-driven restarts.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      # Same idea as HOST_POSTGRES_PORT above.
      - "127.0.0.1:${HOST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # See the postgres restart comment above.
    restart: unless-stopped

  # Local Telegram Bot API server: raises the bot's upload limit from
  # 50 MB (api.telegram.org) to 2000 MB. It runs only in the
  # `local-bot-api` profile, which .env enables together with
  # USE_LOCAL_BOT_API=true (COMPOSE_PROFILES=local-bot-api, see
  # .env.example). Without credentials the server exits at once, so
  # starting it unconditionally left it in a restart loop.
  #
  # TELEGRAM_API_ID / TELEGRAM_API_HASH are a free application
  # registration at https://my.telegram.org/apps, not the bot token.
  # Moving a bot here from api.telegram.org needs a one-time logOut on
  # the cloud API first (docs/deployment.md).
  telegram-bot-api:
    profiles: ["local-bot-api"]
    # Pinned by tag and digest: an unpinned :latest changes under a
    # running deployment on the next pull. Multi-arch (amd64, arm64).
    image: aiogram/telegram-bot-api:10.2@sha256:e0c2d269555a39d37b77ed6dd6fa5e4153b8d8399c6de9f249808682cdd942a5
    environment:
      # Settings refuses to start bot/worker with USE_LOCAL_BOT_API=true
      # and either credential missing; the soft defaults only keep
      # `docker compose config` working without them.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-0}
      TELEGRAM_LOCAL: "1"
    volumes:
      # The server's state (TELEGRAM_WORK_DIR): the bot's login session
      # on this server and its data. In a volume so a recreated
      # container keeps it. Files are uploaded to the server over HTTP
      # (multipart), so it needs no access to the worker's downloads;
      # their temporary copy lives in TELEGRAM_TEMP_DIR inside the
      # container and is not covered by the disk guard.
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  # One-shot schema migration. bot and worker start only after it exits
  # successfully: the worker's crons query the schema too, so applying
  # migrations from the bot's entrypoint let a fresh worker run against
  # an empty database ("relation download_requests does not exist").
  migrate:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    env_file:
      - .env
    # Persistent JSON logs (ADR 0006): /var/log/umd/bot.log, rotated.
    # A named volume, not ./logs: the container runs as uid 10001, and a
    # fresh named volume inherits the image directory's ownership.
    # Survives `down` / `up -d`; only `down -v` removes it. Read with:
    #   docker compose exec bot tail -f /var/log/umd/bot.log
    environment:
      LOG_DIR: /var/log/umd
    volumes:
      - app_logs:/var/log/umd
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    # Same image as bot (same code and dependencies), different command.
    command: ["arq", "src.infrastructure.queue.worker_settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      LOG_DIR: /var/log/umd
    volumes:
      # Persistent logs, see the bot service: /var/log/umd/worker.log.
      - app_logs:/var/log/umd
      # Downloads (DOWNLOAD_STORAGE_DIR in worker_settings.py). A volume,
      # so the disk guard and the cleanup cron see one place that
      # survives a container recreate.
      - download_storage:/tmp/umd-downloads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # arq writes a heartbeat key to Redis every health_check_interval
    # (see WorkerSettings); `arq --check` exits non-zero once it expires.
    healthcheck:
      test: ["CMD", "arq", "--check", "src.infrastructure.queue.worker_settings.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  download_storage:
  app_logs:
  telegram_bot_api_data:
