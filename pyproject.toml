[project]
name = "universal-media-downloader"
version = "1.0.0"
description = "Production-ready Telegram media downloader — SaaS-oriented architecture"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ivan Sytnik" }]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.7,<4.0",
    "aiogram-i18n>=1.4",
    "fluent.runtime>=0.4",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "arq>=0.26,<1.0",
    "yt-dlp>=2026.08.19",
    # Opt-in error reporting (SENTRY_DSN); inert when unset. ADR 0006.
    "sentry-sdk>=2.20,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage gate applies to the core layers (domain + application). The
# --cov targets are passed on the command line (CI, `make test-cov`) so a
# plain `pytest` stays fast and does not require pytest-cov.
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
